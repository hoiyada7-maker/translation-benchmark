<script>
const state = { files:{}, gold:null, source:null, engines:[], selected:[], base:"", showSrc:false,
               scores:{}, flags:{} };

function parseSRT(text){
  const blocks = {};
  text.replace(/\r\n/g,"\n").trim().split(/\n\s*\n/).forEach(ch=>{
    const l = ch.split("\n");
    if(l.length<2) return;
    const idx = l[0].trim();
    if(!/^\d+$/.test(idx)) return;
    blocks[idx] = { ts:(l[1]||"").trim(), text:l.slice(2).join(" ").trim() };
  });
  return blocks;
}
function engineOf(name){
  const m = name.replace(/\.srt$/i,"");
  const parts = m.split(".");
  if(parts.length<2) return {kind:"source", eng:"원문(EN)", base:parts[0]};
  const eng = parts[parts.length-1];
  const base = parts.slice(0,-1).join(".");
  if(eng.toLowerCase()==="gold") return {kind:"gold", eng:"정답지", base};
  return {kind:"engine", eng, base};
}
function lsKey(){ return "trviewer:"+state.base; }
function save(){ localStorage.setItem(lsKey(), JSON.stringify({scores:state.scores,flags:state.flags})); }
function load(){ try{ const d=JSON.parse(localStorage.getItem(lsKey())||"{}");
  state.scores=d.scores||{}; state.flags=d.flags||{}; }catch(e){ state.scores={};state.flags={}; } }

async function addFiles(list){
  for(const f of list){
    const txt = await f.text();
    const info = engineOf(f.name);
    state.base = info.base || state.base;
    const blocks = parseSRT(txt);
    if(info.kind==="gold") state.gold = {name:info.eng, blocks};
    else if(info.kind==="source") state.source = {name:info.eng, blocks};
    else {
      if(!state.engines.find(e=>e.eng===info.eng)) state.engines.push({eng:info.eng, blocks});
    }
  }
  load();
  // default select up to 3 engines
  if(state.selected.length===0) state.selected = state.engines.slice(0,3).map(e=>e.eng);
  renderEngines(); render();
}

function renderEngines(){
  const box = document.getElementById("engines");
  box.innerHTML = "";
  if(state.gold){ const g=document.createElement("span"); g.textContent="정답지(고정)";
    g.style.cssText="border:1px solid #e0c96a;background:#fdf3d6;border-radius:6px;padding:3px 8px;font-weight:600;color:#8a6d0f"; box.appendChild(g); }
  state.engines.forEach(e=>{
    const on = state.selected.includes(e.eng);
    const dis = !on && state.selected.length>=3;
    const lb = document.createElement("label");
    lb.className = "eng"+(on?" on":"")+(dis?" dis":"");
    lb.textContent = e.eng;
    lb.onclick = ()=>{
      if(on) state.selected = state.selected.filter(x=>x!==e.eng);
      else if(state.selected.length<3) state.selected.push(e.eng);
      renderEngines(); render();
    };
    box.appendChild(lb);
  });
}

function allIdx(){
  const set = new Set();
  const add = o=>{ if(o) Object.keys(o.blocks).forEach(k=>set.add(+k)); };
  add(state.gold); add(state.source); state.engines.forEach(e=>set.add&&Object.keys(e.blocks).forEach(k=>set.add(+k)));
  return [...set].sort((a,b)=>a-b);
}

function cols(){
  const c = [];
  if(state.gold) c.push({eng:"정답지", gold:true, blocks:state.gold.blocks});
  state.selected.forEach(name=>{ const e=state.engines.find(x=>x.eng===name); if(e) c.push({eng:name, blocks:e.blocks}); });
  return c;
}

function render(){
  const idxs = allIdx();
  if(idxs.length===0){ return; }
  document.getElementById("hint").style.display="none";
  const C = cols();

    const ts = (state.gold&&state.gold.blocks[i]?.ts) || (state.source&&state.source.blocks[i]?.ts) || "";

    }

      const t = c.blocks[i]?.text || "";
      const fl = !c.gold && state.flags[c.eng] && state.flags[c.eng][i];
      html += `<td class="cell ${c.gold?'gold':''} ${fl?'flag':''}" data-eng="${c.gold?'':esc(c.eng)}" data-idx="${i}">${esc(t)||'<span class=empty>—</span>'}</td>`;
    }
    html += "</tr>";
  }
  tb.innerHTML = html;
  renderScore();
}
function esc(s){ return (s||"").replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

document.getElementById("tbody").addEventListener("click",e=>{
  const td = e.target.closest("td.cell"); if(!td) return;
  const eng = td.dataset.eng; if(!eng) return; // gold not flaggable
  const idx = td.dataset.idx;
  state.flags[eng] = state.flags[eng]||{};
  if(state.flags[eng][idx]){ delete state.flags[eng][idx]; td.classList.remove("flag"); }
  else { state.flags[eng][idx]=true; td.classList.add("flag"); }
  save(); renderScore();
});

function renderScore(){
  const C = cols().filter(c=>!c.gold);
  const panel = document.getElementById("scorePanel");
  if(C.length===0){ panel.hidden=true; return; }
  panel.hidden=false;
  const tbl = document.getElementById("scoreTbl");
  const total = allIdx().length;
  tbl.innerHTML = "<tr><th>엔진</th><th>총점(0~100)</th><th>플래그(오역·누락)</th><th>메모</th></tr>" +
    C.map(c=>{
      const sc = state.scores[c.eng]||{};
      const fcount = state.flags[c.eng]?Object.keys(state.flags[c.eng]).length:0;
      return `<tr><td><b>${c.eng}</b></td>`+
        `<td><input type="number" min="0" max="100" data-sc="${esc(c.eng)}" value="${sc.score??''}"></td>`+
        `<td>${fcount} / ${total}</td>`+
        `<td><textarea data-nt="${esc(c.eng)}">${esc(sc.notes||'')}</textarea></td></tr>`;
    }).join("");
  tbl.querySelectorAll("input[data-sc]").forEach(inp=>inp.onchange=()=>{
    const e=inp.dataset.sc; state.scores[e]=state.scores[e]||{}; state.scores[e].score=inp.value; save(); });
  tbl.querySelectorAll("textarea[data-nt]").forEach(t=>t.onchange=()=>{
    const e=t.dataset.nt; state.scores[e]=state.scores[e]||{}; state.scores[e].notes=t.value; save(); });
}

// wiring
const drop = document.getElementById("drop"), fileInput = document.getElementById("file");
drop.onclick = ()=>fileInput.click();
fileInput.onchange = ()=>addFiles([...fileInput.files]);
["dragover","dragenter"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("hot");}));
["dragleave","drop"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();if(ev!=="drop")drop.classList.remove("hot");}));
document.addEventListener("drop",e=>{ drop.classList.remove("hot");
  if(e.dataTransfer?.files?.length) addFiles([...e.dataTransfer.files]); });
document.getElementById("showSrc").onchange = e=>{ state.showSrc=e.target.checked; render(); };
document.getElementById("clearScore").onclick = ()=>{ if(confirm("이 문서의 채점·플래그를 모두 지울까요?")){
  state.scores={}; state.flags={}; save(); render(); } };
</script>
</body>
</html>
